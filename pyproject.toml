[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "isc-reporter"
dynamic = ["version"]
description = "Reports and change-impact analysis for SailPoint Identity Security Cloud: search, certification campaigns, identity attribute history, identity attribute mappings and transform dependencies, leavers with access, source migrations, attribute sync and role enablement forecasts. Read-only."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [{ name = "Ousmane N'Diaye" }]
keywords = ["sailpoint", "identity-security-cloud", "identitynow", "iam", "iga", "reporting",
            "excel", "pdf", "certification", "audit"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: System Administrators",
    "Intended Audience :: Information Technology",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Security",
    "Topic :: System :: Systems Administration",
    "Topic :: Office/Business",
]
dependencies = [
    "sailpoint>=2.1,<3",
    "XlsxWriter>=3.1",
    "reportlab>=4",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.5", "openpyxl>=3.1", "build>=1"]

[project.scripts]
isc-reporter = "isc_reporter.cli:main"
iscr = "isc_reporter.cli:main"

[project.urls]
Homepage = "https://github.com/NDIAYE-baoussou/isc-reporter"
Issues = "https://github.com/NDIAYE-baoussou/isc-reporter/issues"
Changelog = "https://github.com/NDIAYE-baoussou/isc-reporter/blob/main/CHANGELOG.md"

[tool.setuptools.dynamic]
version = { attr = "isc_reporter.__version__" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
isc_reporter = ["templates/*.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 110
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
